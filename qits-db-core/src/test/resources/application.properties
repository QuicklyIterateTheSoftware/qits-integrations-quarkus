# The datasource itself is handed over by ProxiedPgResource at run time: its url names a proxy port
# chosen when the rig starts, which cannot be written into a file.

# Nothing here serves HTTP, but a @QuarkusTest starts whatever server the classpath brings, and
# 8081 is the npm registry on this platform's development hosts.
quarkus.http.test-port=0

# No container may be started behind the suite's back: the rig is zonky's postgres, spawned from
# Maven artifacts, and a dev service quietly supplying a second database would make a green run
# mean nothing.
quarkus.devservices.enabled=false
