# THE TAG STARTS THIS, NOT THE RELEASE ANNOUNCEMENT. `SCMPublishTag` is the git host's fact that a
# tag ref landed, so this reactor is deployed for a real release AND for a bootstrap replay, which
# pushes the tags and nothing else — the restore path (bootstrap-replay-plan.md in the wrapper).
# `artifacts:` is unchanged and still a declaration: qits-ci announces `SoftwareRelease` only where
# a green run and an `SCMRelease` meet, so a replay redeploys silently and a real release announces
# exactly as before.
event: SCMPublishTag
when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match on repoId never fires. The tag event echoes the public name the push
  # was addressed with; a rename updates this line in the same campaign.
  - repoName: { exact: qits-integrations-quarkus-javalib }
artifacts:
  - { type: maven, name: "eu.wohlben.qits:qits-auth-core" }
  - { type: maven, name: "eu.wohlben.qits:qits-arch-rules" }
  - { type: maven, name: "eu.wohlben.qits:qits-db-core" }
  - { type: maven, name: "eu.wohlben.qits:qits-environment-core" }
  - { type: maven, name: "eu.wohlben.qits:qits-service-mock" }
steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      set -eu
      # THE TAG NAME IS THE VERSION. Nothing upstream vets it now that any tag push reaches here,
      # and it becomes a registry coordinate for three modules, so the shape is checked before
      # anything is fetched or deployed: a CalVer is digits and dots.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .tagName)
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"
      # Skip only when EVERY module of this reactor is published: `deploy` runs at the root
      # and ships them together, so one missing module means the whole run must go again.
      if curl -fsS -o /dev/null "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-auth-core/$version/qits-auth-core-$version.pom" \
        && curl -fsS -o /dev/null "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-arch-rules/$version/qits-arch-rules-$version.pom" \
        && curl -fsS -o /dev/null "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-db-core/$version/qits-db-core-$version.pom" \
        && curl -fsS -o /dev/null "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-environment-core/$version/qits-environment-core-$version.pom" \
        && curl -fsS -o /dev/null "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-service-mock/$version/qits-service-mock-$version.pom"; then
        echo "every module @$version is already published — skipping"
        exit 0
      fi
      ./mvnw -B -ntp deploy -DskipTests \
        -DaltDeploymentRepository="qits::default::$QITS_MAVEN_REGISTRY_URL"
      # THE SBOM IS THE ARTIFACT'S RESOLVED DEPENDENCY TREE, one per declared module, and it goes up
      # in this step — after the deploy, before the run goes green. qits-ci announces
      # `SoftwareRelease` only for a green run, so an SBOM published here can never be missing for a
      # version somebody was told about. A failed PUT fails the release ON PURPOSE.
      #
      # ONE makeBom PER MODULE, because the bill of materials is per artifact and a reactor-wide run
      # would answer for the parent pom instead. The module DIRECTORIES and the artifactIds are the
      # same five strings in this repository, which is what lets one list drive both `-pl` and the
      # coordinate — check both if a module is ever renamed on one side only.
      #
      # The plugin resolves from the same repositories mvnw already resolves through; no second
      # channel, and no address spelled here.
      sbom_base="${QITS_MAVEN_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      for module in qits-auth-core qits-arch-rules qits-db-core \
                    qits-environment-core qits-service-mock; do
        ./mvnw -B -ntp -DskipTests -pl "$module" \
          org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
          -DoutputFormat=json -DoutputName=sbom -DschemaVersion=1.6
        curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
          --data-binary "@$module/target/sbom.json" \
          "$sbom_base/maven/eu.wohlben.qits:$module/-/$version"
      done
