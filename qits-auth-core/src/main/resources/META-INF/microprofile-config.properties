# Defaults for qits-auth-core. Identity from the edge for users (migration-auth-plan.md), and the
# rollout gate for machine tokens (qits-idp-plan.md phase 1).
#
# Shipped as microprofile-config.properties, not application.properties, because Quarkus reads THIS
# file from dependency jars (ordinal 100, below a consuming application's application.properties at
# 250 and env at 300). Nothing here is a variant: services have no variant to select.
#
# A service that adopts this jar DELETES its own copy of these keys. Two files at the same ordinal
# make the winner arbitrary.

# The header qits-gateway asserts. It sits under the gateway's reserved X-Qits-* prefix, which the
# gateway strips from every inbound request unconditionally — that stripping is what makes believing
# this header safe. Overridable per deployment, but there is no reason to.
qits.auth.forward.user-header=X-Qits-User

# The everyday dev/test identity when nothing injects the header — no gateway fronts `quarkus:dev`
# or a test suite, and this is what keeps them runnable with no auth setup. LaunchMode-guarded in
# ForwardAuthMechanism: a prod (NORMAL) build ignores it even if the property leaks in via env.
%dev.qits.auth.forward.dev-user=dev
%test.qits.auth.forward.dev-user=dev

# The machine-token rollout gate. Off means every MachineAuth.require* call returns at once and the
# endpoint behaves as it does today — network trust. Turn it on per service once qits-idp is
# deployed and the service is issuing/validating bearers; it then also needs
# qits.auth.machine.audience, or startup fails.
qits.auth.machine.required=false
